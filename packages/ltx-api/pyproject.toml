[project]
name = "ltx-api"
version = "0.1.0"
description = "Self-hosted REST API mirroring LTX commercial API (docs.ltx.video)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-cov>=6.0"]
real = ["ltx-pipelines"]

[project.scripts]
ltx-api = "ltx_api.main:run"
ltx-gpu-worker = "ltx_api.worker.server:run"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
ltx-pipelines = { workspace = true }

[tool.pytest.ini_options]
markers = [
  "gpu: tests requiring GPU and model weights",
]
testpaths = ["tests"]
