# Run **ltx-api** from Artifact Registry — image built by Cloud Build, not on this host.
# On the GCP VM: save as docker-compose.yml under /opt/ltx + .env with LTX_DOCKER_IMAGE.
# Do not use deploy/docker-compose.yml here (that file is for local `docker compose build`).

services:
  ltx-api:
    container_name: ltx-api
    image: ${LTX_DOCKER_IMAGE:?set LTX_DOCKER_IMAGE in .env e.g. REGION-docker.pkg.dev/PROJECT/REPO/ltx-api:latest}
    restart: unless-stopped
    ports:
      - "${LTX_PUBLISH_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      LTX_API_INFERENCE_BACKEND: "${LTX_API_INFERENCE_BACKEND:-vastai}"
      LTX_API_STORAGE_DIR: /data/ltx-api-storage
    volumes:
      - ltx_api_storage:/data/ltx-api-storage
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "ltx_api.main:create_app_instance",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]

volumes:
  ltx_api_storage:
